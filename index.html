<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(OUwNO)Ant</title>

  <!-- Favicon and Theme Color -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
  <meta name="theme-color" content="#1a1a1a">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ✅ 正确的结构: #main-layout 必须在 #app-wrapper 内部 -->
  <div id="app-wrapper">
    <!-- 新增：简洁静态页面覆盖层 -->
    <div id="landing-overlay">
      <div id="landing-content">
        <!-- 背景图片 -->
        <img id="background-image" src="" alt="" />

        <!-- 毛玻璃内容面板 -->
        <div id="glass-panel" class="glass-panel">
          <h1 id="main-title" class="title-glass animate-fade-in">(OUwNO)Ant</h1>
          <p id="main-subtitle" class="subtitle-glass animate-slide-up">Langton's Ant 3D Visualization</p>
          <div id="custom-text" class="text-gray-300 mb-8"></div>

          <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button id="start-btn" class="button-glass animate-slide-up">进入体验</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 简化的3D场景 (初始隐藏) -->
    <div id="main-layout" class="hidden w-full h-full flex flex-col">
      <!-- 3D Canvas 容器 -->
      <div id="scene-container" class="flex-1 relative">
        <!-- 3D Canvas 将被添加到这里 -->

        <!-- 监视器信息保留在右上角 -->
        <div id="monitor-overlay-ui" class="absolute top-4 right-4">
          <!-- 监视器信息将在这里显示 -->
        </div>
      </div>

      <!-- 步数进度条 (独立在顶部) -->
      <div id="progress-container" class="h-15 bg-gray-900/95 backdrop-blur-2xl saturate-180 border-t border-white/10 border-b border-white/5 flex items-center justify-center px-6 gap-5 z-100">
        <div class="time-display text-gray-400 font-mono text-sm min-w-25 text-center font-medium">
          <span id="current-step">0</span>
          <span class="mx-1.5 opacity-70">/</span>
          <span id="total-steps">0</span>
        </div>
        <div class="flex-1 h-2 relative mx-5">
          <div class="progress-bar w-full h-full bg-white/10 rounded-full relative cursor-pointer overflow-hidden">
            <div id="progress-fill" class="h-full bg-gradient-to-r from-teal-600 to-teal-700 rounded-full transition-all duration-100 relative w-0"></div>
            <input type="range" id="progress-slider" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer z-2" min="0" max="100" value="0">
          </div>
        </div>
      </div>

      <!-- 底部控制面板 -->
      <div id="control-panel" class="relative h-20 bg-gray-900/95 backdrop-blur-2xl saturate-180 border-t border-white/10 flex items-center justify-between px-6 gap-5 z-100">
        <!-- 左侧视角控制按钮 -->
        <div class="flex gap-2">
          <button id="view-left" class="w-9 h-9 border border-white/20 bg-white/5 text-gray-400 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center hover:bg-teal-600/30 hover:border-teal-500 hover:text-white hover:-translate-y-0.5" title="左视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          </button>
          <button id="view-front" class="w-9 h-9 border border-white/20 bg-white/5 text-gray-400 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center hover:bg-teal-600/30 hover:border-teal-500 hover:text-white hover:-translate-y-0.5" title="正视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
            </svg>
          </button>
          <button id="view-top" class="w-9 h-9 border border-white/20 bg-white/5 text-gray-400 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center hover:bg-teal-600/30 hover:border-teal-500 hover:text-white hover:-translate-y-0.5" title="顶视图">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 14l5-5 5 5z"/>
            </svg>
          </button>
          <button id="view-perspective" class="w-9 h-9 border border-white/20 bg-white/5 text-gray-400 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center hover:bg-teal-600/30 hover:border-teal-500 hover:text-white hover:-translate-y-0.5" title="透视相机">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l-5.5 9h11z"/>
              <circle cx="17.5" cy="17.5" r="4.5"/>
              <path d="M3 13.5h8v8H3z"/>
            </svg>
          </button>
        </div>

        <!-- 中央播放控制区域 -->
        <div class="flex items-center gap-1">
          <!-- 步数快退 -->
          <button id="step-backward" class="w-10 h-10 border-none bg-transparent text-gray-400 cursor-pointer transition-all duration-200 rounded-full flex items-center justify-center hover:bg-white/10 hover:text-white hover:scale-105" title="快退10步">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
            </svg>
          </button>

          <!-- 播放/暂停按钮 -->
          <button id="play-pause" class="w-12 h-12 bg-teal-600 text-white border-none cursor-pointer transition-all duration-200 rounded-full flex items-center justify-center hover:bg-teal-700 hover:scale-105 hover:shadow-lg hover:shadow-teal-600/40 mx-2 active:scale-95" title="播放/暂停">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="play-icon">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="pause-icon" style="display: none;">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <!-- 步数快进 -->
          <button id="step-forward" class="w-10 h-10 border-none bg-transparent text-gray-400 cursor-pointer transition-all duration-200 rounded-full flex items-center justify-center hover:bg-white/10 hover:text-white hover:scale-105" title="快进10步">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
            </svg>
          </button>
        </div>

        <!-- 右侧音乐控制 -->
        <div class="flex gap-2">
          <button id="audio-toggle" class="w-10 h-10 border border-white/20 bg-white/5 text-gray-400 rounded-full cursor-pointer transition-all duration-200 flex items-center justify-center hover:bg-white/10 hover:border-teal-500 hover:text-white hover:scale-105" title="播放/暂停音乐">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="audio-off">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="audio-on" style="display: none;">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/landing-page.ts"></script>
</body>
</html>
