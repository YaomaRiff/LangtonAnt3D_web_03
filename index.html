<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(OUwNO)Ant</title>

  <!-- Favicon and Theme Color -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
  <meta name="theme-color" content="#1a1a1a">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ✅ 正确的结构: #main-layout 必须在 #app-wrapper 内部 -->
  <div id="app-wrapper">
    <!-- 新增：简洁静态页面覆盖层 -->
    <div id="landing-overlay">
      <div id="landing-content">
        <!-- 背景图片 -->
        <img id="background-image" src="" alt="" />

        <!-- 毛玻璃内容面板 -->
        <div id="glass-panel" class="glass-panel">
          <h1 id="main-title" class="title-glass animate-fade-in">(OUwNO)Ant</h1>
          <p id="main-subtitle" class="subtitle-glass animate-slide-up">Langton's Ant 3D Visualization</p>
          <div id="custom-text" class="text-gray-300 mb-8"></div>

          <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button id="start-btn" class="button-glass animate-slide-up">进入体验</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 简化的3D场景 (初始隐藏) -->
    <div id="main-layout" class="hidden w-full h-full flex">
      <!-- 3D Canvas 容器 -->
      <div id="scene-container" class="flex-1 relative">
        <!-- 3D Canvas 将被添加到这里 -->

        <!-- 简化的UI覆盖层 -->
        <div id="ui-overlay" class="absolute top-4 left-4 space-y-4">
          <!-- 动画控制 -->
          <div id="animation-control" class="ui-control-panel">
            <!-- 动画控制内容将在这里生成 -->
          </div>

          <!-- 相机控制 -->
          <div id="camera-control" class="ui-control-panel">
            <!-- 相机控制内容将在这里生成 -->
          </div>

          <!-- 预设管理 -->
          <div id="preset-control" class="ui-control-panel">
            <!-- 预设控制内容将在这里生成 -->
          </div>

          <!-- 音频控制 -->
          <div id="audio-control" class="ui-control-panel">
            <!-- 音频控制内容将在这里生成 -->
          </div>
        </div>

        <!-- 监视器信息保留在右上角 -->
        <div id="monitor-overlay-ui" class="absolute top-4 right-4">
          <!-- 监视器信息将在这里显示 -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/landing-page.ts"></script>
</body>
</html>
